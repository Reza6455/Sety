<!doctype html>
<html lang="fa" dir="rtl">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>پنل نتایج ❤️</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff0f6;
  color:#702647;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:25px;
}

.box{
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 35px #a52f6118;
  margin-bottom:18px;
}

input,button{
  padding:12px;
  border-radius:10px;
  font:15px Arial;
}

input{
  border:2px solid #ffd0e1;
  width:100%;
  box-sizing:border-box;
  margin-bottom:10px;
}

button{
  border:0;
  background:#df3e7d;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  margin-left:8px;
}

.secondary{
  background:#9b6480;
}

.hide{
  display:none!important;
}

.table{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th,td{
  padding:10px;
  border-bottom:1px solid #f2d8e3;
  text-align:right;
}

th{
  background:#fff3f8;
}

.muted{
  opacity:.7;
  font-size:13px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.error{
  color:#b42318;
}

.success{
  color:#147a4b;
}

</style>

</head>

<body>

<div class="wrap">

<h1>
  پنل خصوصی نتایج ستایش ❤️
</h1>


<!-- LOGIN -->

<div class="box" id="login">

<h3>
  ورود مدیر 🔐
</h3>

<input
  id="email"
  type="email"
  autocomplete="username"
  placeholder="ایمیل"
>

<input
  id="password"
  type="password"
  autocomplete="current-password"
  placeholder="رمز عبور"
>

<button onclick="login()">
  ورود
</button>

<p class="muted">
  فقط حسابی که در Supabase به‌عنوان
  ادمین ثبت شده می‌تواند پاسخ‌ها را ببیند.
</p>

<p id="msg"></p>

</div>


<!-- PANEL -->

<div id="panel" class="hide">

<div class="box">

<div class="actions">

<button onclick="load()">
  به‌روزرسانی 🔄
</button>

<button
  class="secondary"
  onclick="logout()"
>
  خروج
</button>

</div>

<p id="status"></p>

</div>


<div class="box table">

<table>

<thead>

<tr>

<th>ثبت</th>

<th>موبایل</th>

<th>تاریخ</th>

<th>ساعت</th>

<th>آهنگ</th>

<th>غذا</th>

<th>هیجان</th>

</tr>

</thead>

<tbody id="rows"></tbody>

</table>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


const SUPABASE_URL =
"https://jhbumkqemvvsjiyqiith.supabase.co";


const SUPABASE_KEY =
"sb_publishable_UPr3S7SXyJOuvYggJ6iA2Q_wF_b_Qkc";


const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const loginBox =
document.getElementById("login");

const panel =
document.getElementById("panel");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const msg =
document.getElementById("msg");

const status =
document.getElementById("status");

const rows =
document.getElementById("rows");


/* =========================
   LOGIN
========================= */

async function login(){

  msg.className = "";

  msg.textContent =
    "در حال ورود...";


  const result =
    await db.auth.signInWithPassword({

      email:
        email.value.trim(),

      password:
        password.value

    });


  if(result.error){

    msg.className =
      "error";

    msg.textContent =
      "ورود ناموفق بود: " +
      result.error.message;

    return;

  }


  loginBox
    .classList
    .add("hide");

  panel
    .classList
    .remove("hide");


  await load();

}


/* =========================
   LOAD
========================= */

async function load(){

  status.className =
    "";

  status.textContent =
    "در حال دریافت پاسخ‌ها...";


  const result =
    await db
      .from("date_responses")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(result.error){

    console.error(
      result.error
    );

    status.className =
      "error";

    status.textContent =
      "دسترسی رد شد: " +
      result.error.message;

    return;

  }


  if(!result.data.length){

    rows.innerHTML = "";

    status.className =
      "success";

    status.textContent =
      "هنوز پاسخی ثبت نشده ❤️";

    return;

  }


  rows.innerHTML =
    result.data
      .map(function(x){

        return `

<tr>

<td>
${escapeHtml(
  new Date(x.created_at)
    .toLocaleString("fa-IR")
)}
</td>

<td>
${escapeHtml(x.phone)}
</td>

<td>
${escapeHtml(x.date)}
</td>

<td>
${escapeHtml(x.time)}
</td>

<td>
${escapeHtml(x.song)}
</td>

<td>
${escapeHtml(x.food)}
</td>

<td>
${escapeHtml(x.excitement)}%
</td>

</tr>

`;

      })
      .join("");


  status.className =
    "success";

  status.textContent =
    result.data.length +
    " پاسخ پیدا شد ❤️";

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await db.auth.signOut();

  panel.classList.add("hide");

  loginBox.classList.remove("hide");

  password.value = "";

  msg.textContent = "";

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    function(c){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[c];

    }
  );

}


/* =========================
   SESSION
========================= */

async function init(){

  const result =
    await db.auth.getSession();


  if(result.data.session){

    loginBox
      .classList
      .add("hide");

    panel
      .classList
      .remove("hide");

    await load();

  }

}


init();

</script>

</body>
</html>
