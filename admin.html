<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل نتایج ❤️</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#fff0f6;color:#702647}.wrap{max-width:1100px;margin:auto;padding:25px}.box{background:#fff;padding:20px;border-radius:20px;box-shadow:0 10px 35px #a52f6118;margin-bottom:18px}input,button{padding:12px;border-radius:10px;font:15px Arial}input{border:2px solid #ffd0e1}button{border:0;background:#df3e7d;color:#fff;font-weight:bold;cursor:pointer}.hide{display:none}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px;border-bottom:1px solid #f2d8e3;text-align:right}th{background:#fff3f8}</style>
<div class="wrap"><h1>پنل خصوصی نتایج ستایش ❤️</h1><div class="box" id="login"><input id="pw" type="password" placeholder="رمز عبور"><button onclick="login()">ورود 🔐</button><p id="msg"></p></div><div id="panel" class="hide"><div class="box"><button onclick="load()">به‌روزرسانی 🔄</button><p id="status"></p></div><div class="box table"><table><thead><tr><th>ثبت</th><th>موبایل</th><th>تاریخ</th><th>ساعت</th><th>آهنگ</th><th>غذا</th><th>هیجان</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL="https://jhbumkqemvvsjiyqiith.supabase.co",KEY="sb_publishable_UPr3S7SXyJOuvYggJ6iA2Q_wF_b_Qkc",db=window.supabase.createClient(URL,KEY),DEMO_PASSWORD="CHANGE_ME";function login(){if(pw.value!==DEMO_PASSWORD){msg.textContent="رمز اشتباه است.";return}document.getElementById("login").classList.add("hide");panel.classList.remove("hide");load()}async function load(){status.textContent="در حال دریافت...";let {data,error}=await db.from("date_responses").select("*").order("created_at",{ascending:false});if(error){status.textContent=error.message;return}rows.innerHTML=data.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString("fa-IR")}</td><td>${e(x.phone)}</td><td>${e(x.date)}</td><td>${e(x.time)}</td><td>${e(x.song)}</td><td>${e(x.food)}</td><td>${e(x.excitement)}%</td></tr>`).join("");status.textContent=data.length+" پاسخ پیدا شد."}function e(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}</script></html>
