<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل نتایج ❤️</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#fff0f6;color:#702647}.wrap{max-width:1100px;margin:auto;padding:25px}.box{background:#fff;padding:20px;border-radius:20px;box-shadow:0 10px 35px #a52f6118;margin-bottom:18px}input,button{padding:12px;border-radius:10px;font:15px Arial}input{border:2px solid #ffd0e1;width:100%;box-sizing:border-box;margin-bottom:10px}button{border:0;background:#df3e7d;color:#fff;font-weight:bold;cursor:pointer;margin-left:8px}.secondary{background:#9b6480}.hide{display:none}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px;border-bottom:1px solid #f2d8e3;text-align:right}th{background:#fff3f8}.muted{opacity:.7;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.error{color:#b42318}.success{color:#147a4b}</style>
<div class="wrap"><h1>پنل خصوصی نتایج ستایش ❤️</h1>
<div class="box" id="login"><h3>ورود مدیر 🔐</h3><input id="email" type="email" autocomplete="username" placeholder="ایمیل"><input id="password" type="password" autocomplete="current-password" placeholder="رمز عبور"><button onclick="login()">ورود</button><p class="muted">فقط حسابی که در Supabase به‌عنوان ادمین ثبت شده می‌تواند پاسخ‌ها را ببیند.</p><p id="msg"></p></div>
<div id="panel" class="hide"><div class="box"><div class="actions"><button onclick="load()">به‌روزرسانی 🔄</button><button class="secondary" onclick="logout()">خروج</button></div><p id="status"></p></div><div class="box table"><table><thead><tr><th>ثبت</th><th>موبایل</th><th>تاریخ</th><th>ساعت</th><th>آهنگ</th><th>غذا</th><th>هیجان</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL="https://jhbumkqemvvsjiyqiith.supabase.co",KEY="sb_publishable_UPr3S7SXyJOuvYggJ6iA2Q_wF_b_Qkc";
const db=window.supabase.createClient(URL,KEY);
async function login(){msg.className="";msg.textContent="در حال ورود...";const {error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.className="error";msg.textContent="ورود ناموفق بود: "+error.message;return}document.getElementById("login").classList.add("hide");panel.classList.remove("hide");load()}
async function load(){status.textContent="در حال دریافت پاسخ‌ها...";const {data,error}=await db.from("date_responses").select("*").order("created_at",{ascending:false});if(error){status.className="error";status.textContent="دسترسی رد شد: "+error.message;return}rows.innerHTML=data.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString("fa-IR")}</td><td>${e(x.phone)}</td><td>${e(x.date)}</td><td>${e(x.time)}</td><td>${e(x.song)}</td><td>${e(x.food)}</td><td>${e(x.excitement)}%</td></tr>`).join("");status.className="success";status.textContent=data.length+" پاسخ پیدا شد."}
async function logout(){await db.auth.signOut();panel.classList.add("hide");document.getElementById("login").classList.remove("hide");password.value="";msg.textContent=""}
async function init(){const {data}=await db.auth.getSession();if(data.session){document.getElementById("login").classList.add("hide");panel.classList.remove("hide");load()}}
function e(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}init();
</script></html>
